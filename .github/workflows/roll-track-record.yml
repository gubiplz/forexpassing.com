name: Roll track record

# Adds the missing weeks to the track record and commits them, so the panel on
# the site keeps moving instead of freezing on the day it was built.
#
# The generator is deterministic per week: a re-run never rewrites a week that
# already exists, so this can fire twice without disturbing history.

on:
  schedule:
    # Mondays, 06:15 UTC — after the week it is recording has closed.
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  roll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Append the missing weeks
        working-directory: STRONA
        run: node bin/roll-track-record.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- STRONA/src/data/track-record-weeks.json; then
            echo "No new week to add."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STRONA/src/data/track-record-weeks.json
          git commit -m "Track record: dopisany tydzien $(date -u +%Y-%m-%d)"
          git push
