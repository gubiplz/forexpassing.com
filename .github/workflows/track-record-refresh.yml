# Odświeża cztery posty na @fx_passingtrackrecord — grafikę i podpis naraz.
#
# Dane track record rolują się dalej (STRONA/bin/roll-track-record.mjs dokłada
# sesje), więc opublikowane posty starzeją się same. Pipeline w tg-graphics/
# czyta żywy panel, przerysowuje plakaty i EDYTUJE istniejące posty zamiast
# wysyłać nowe — post zachowuje ID, a więc wyświetlenia i reakcje, których nie
# da się przenieść.
#
# ŻADNEGO `schedule:` — harmonogram Actions na tym repo nie działa (sprawdzone
# dwoma wariantami, zero przebiegów, przy działającym workflow_dispatch; patrz
# nagłówek telegram-spots.yml).
#
# Budzikiem jest UDANY DEPLOY PRODUKCYJNY, i to nie obejście, a właściwy moment.
# Seria track record rośnie w `npm run build`, którego pierwszym krokiem jest
# STRONA/bin/roll-track-record.mjs — czyli dane na stronie ruszają się WYŁĄCZNIE
# przy deployu i między deployami stoją. Skoro plakaty są zrzutem tej strony, to
# tydzień jako jednostka był tylko przybliżeniem: cotygodniowy cron trafiałby w
# tygodnie bez deploya (nic do odświeżenia) i przesypiał deploye w środku
# tygodnia (posty rozjechane ze stroną nawet na sześć dni). Deploy trafia zawsze.
#
# Dlatego ten plik nie potrzebuje żadnego sekretu do odpalania siebie: zdarzenie
# przychodzi od integracji Vercel↔GitHub, która już tu jest. Wcześniejsza wersja
# szła przez cron Vercela → STRONA/api/track-refresh.js → workflow_dispatch i
# wymagała fine-grained PAT-a w zmiennych Vercela; ten PAT wygasa i jest kolejną
# rzeczą do pilnowania. Endpoint został usunięty, historia w gicie.
#
# Deploye podglądowe też wysyłają to zdarzenie, dlatego `if` na całym jobie
# przepuszcza tylko Production i stan `success`. Odrzucone przebiegi widać w
# Actions jako pominięte — to koszt tego, że `on:` nie umie filtrować środowiska.
#
# Ręcznie: zakładka Actions → „Track record refresh" → Run workflow.

name: Track record refresh

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Przeliczyć i wyrenderować, ale NIE pisać do Telegrama'
        type: boolean
        default: false

permissions:
  contents: read

# Dwa przebiegi naraz edytowałyby te same cztery posty. Kolejkujemy zamiast
# przerywać — przerwanie w połowie zostawia część postów odświeżonych.
concurrency:
  group: track-record-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Bez tego każdy deploy podglądowy i każdy stan pośredni („queued",
    # „in_progress", „error") ciągnąłby pełny przebieg przeglądarki.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tg-graphics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Zły albo cofnięty token widać dopiero przy ostatnim kroku, po trzech
      # przebiegach przeglądarki. Sprawdzamy go na wejściu, żeby nie palić
      # pięciu minut na przebieg, który i tak nie ma prawa nic zapisać.
      #
      # NIE przez getChat: na publicznym kanale udaje się ono KAŻDEMU botowi,
      # także takiemu, który nie jest tam adminem — pierwsza wersja tej kontroli
      # przepuściła dokładnie taki token i przebieg padł dopiero na zapisie.
      # Pytamy więc o status samego bota; jego numeryczne id to przedrostek
      # tokena przed dwukropkiem.
      - name: Sprawdź, czy bot jest adminem kanału
        if: ${{ !inputs.dry }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TRACK_BOT_TOKEN }}
          TG_CHAT: '@fx_passingtrackrecord'
        run: |
          if [ -z "$TG_TOKEN" ]; then
            echo "::error::brak sekretu TELEGRAM_TRACK_BOT_TOKEN w repozytorium"
            exit 1
          fi
          bot_id="${TG_TOKEN%%:*}"
          odp=$(curl -sS "https://api.telegram.org/bot${TG_TOKEN}/getChatMember?chat_id=${TG_CHAT}&user_id=${bot_id}")
          status=$(echo "$odp" | sed -n 's/.*"status":"\([a-z]*\)".*/\1/p')
          if [ "$status" != "administrator" ] && [ "$status" != "creator" ]; then
            echo "::error::bot $bot_id nie jest adminem ${TG_CHAT} (status: ${status:-brak}) — $(echo "$odp" | head -c 200)"
            exit 1
          fi
          echo "bot $bot_id jest adminem ${TG_CHAT}"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Osobny sekret od TELEGRAM_BOT_TOKEN: tamten bot jest adminem @fx_passing
      # (sync opisu kanału), ale nie kanału track record. Jeden token do obu
      # ról wymagałby dodania tego samego bota jako admina wszędzie — a to
      # szersze uprawnienia niż którakolwiek z tych robót potrzebuje.
      #
      # Pipeline czyta forexpassing.com, nie adres z `environment_url` — ten
      # ostatni prowadzi na deployment URL, który ochrona deploymentów zasłania
      # przekierowaniem na logowanie Vercela (sprawdzone: 302 zamiast 200).
      # Czekanie na przepięcie aliasu nie jest potrzebne: kroki powyżej
      # (checkout, Node, npm ci, chromium) dają około minuty zapasu, a nawet
      # gdyby scrape trafił jeszcze poprzedni build, roll-track-record dokłada
      # sesje „do dziś" — dwa buildy tego samego dnia dają te same liczby.
      - name: Odśwież posty
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TRACK_BOT_TOKEN }}
        run: node refresh.js ${{ inputs.dry && '--dry' || '' }}

      # Plakat ciąga Anton i Archivo z Google Fonts, a rendery w CI potrafią
      # wyjść inaczej niż lokalnie. Artefakt pozwala obejrzeć, co poszło na
      # kanał, bez odtwarzania całego przebiegu u siebie.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plakaty
          path: |
            tg-graphics/poster2-*.png
            tg-graphics/track-data.json
          retention-days: 14
