# Trzyma opis kanału @forexpassingcom zgodny z licznikiem miejsc na /thank-you.
#
# Liczba na stronie jest funkcją pory dnia w Nowym Jorku (STRONA/src/lib/spots.ts),
# więc nie ma zdarzenia, na które dałoby się zareagować — trzeba sprawdzać samemu.
# Skrypt jest bezstanowy i wysyła cokolwiek tylko wtedy, gdy opis faktycznie się
# różni, więc pusty przebieg kosztuje jedno `getChat`, a realnych zapisów wychodzi
# ~7 na dobę (tyle, ile progów licznika).
#
# Ten sam skrypt uruchamiany cyklicznie robi produkcyjny endpoint
# STRONA/api/spots-sync.js, wołany z Make — tu jest to samo do ręki.
#
# Repozytorium jest publiczne, więc minuty Actions są darmowe i bez limitu.
# Token bota siedzi w sekrecie repozytorium TELEGRAM_BOT_TOKEN — nigdy w kodzie.
#
# UWAGA: GitHub usypia zaplanowane workflowy po 60 dniach bez commita w repo.
# Ręczne odpalenie: zakładka Actions → „Telegram spots sync" → Run workflow.

name: Telegram spots sync

on:
  # ŻADNEGO `schedule:` — i to nie jest przeoczenie.
  #
  # Harmonogram GitHub Actions na tym repo NIE DZIAŁA. Sprawdzone dwoma
  # wariantami: `*/5 * * * *` (2,5 godziny, zero przebiegów) i rzadkim
  # harmonogramem celującym w progi licznika plus dogrywką co godzinę (również
  # zero). W tym samym czasie `workflow_dispatch` odpalał się bez pudła, repo
  # jest publiczne, aktywne, nie jest forkiem ani archiwum, a workflow ma stan
  # `active` — czyli konfiguracja była poprawna, a event `schedule` po prostu
  # nie przychodził. Nie wracamy do tego bez nowego dowodu.
  #
  # Budzikiem jest scenariusz w Make („Forex Passing — spots → Telegram"),
  # uderzający POST-em w STRONA/api/spots-sync.js z nagłówkiem `x-sync-key`.
  # Interwał ustawia się TAM, nie w repo — progi licznika wypadają co ~3 h 26 min
  # (86400 / 7 z SPOTS_STEP), więc interwał wyznacza, o ile opis może się spóźnić
  # za stroną: pół godziny to ≤30 min poślizgu, dwie godziny to ≤2 h.
  #
  # W vercel.json był na to cron przez pół dnia i został zdjęty — harmonogram
  # miał być w jednym miejscu, a nie w dwóch, które trzeba uzgadniać.
  #
  # Ten workflow zostaje jako RĘCZNE narzędzie: wymusza sync po zmianie tekstu
  # opisu albo gdy trzeba sprawdzić, co skrypt widzi.
  workflow_dispatch:

permissions:
  contents: read

# Dwa przebiegi naraz pisałyby ten sam opis. Kolejkujemy zamiast przerywać —
# przerwanie w połowie zapisu jest gorsze niż chwila czekania.
concurrency:
  group: telegram-spots
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Node 24 czyta pliki .ts wprost (type stripping), dlatego skrypt może
      # importować src/lib/spots.ts i liczyć DOKŁADNIE to samo co przeglądarka,
      # bez budowania czegokolwiek. Stąd też brak `npm ci`: ani skrypt, ani te
      # dwa moduły nie mają zależności.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync channel description
        working-directory: STRONA
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node bin/sync-telegram-spots.mjs
