    <!-- Resolution only. Every one of these hosts is now fetched after first
         paint, so holding open a TCP+TLS connection for them would take
         bandwidth away from the bundle on a mobile connection. -->
    <link rel="dns-prefetch" href="https://fast.wistia.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <link rel="dns-prefetch" href="https://www.clarity.ms" />

    <!-- Landing display type. Served from our own origin: the headline is set at
         80px, and going out to Google costs a round trip for the stylesheet and
         another for the font file before the real face is even discovered. The
         @font-face rules live in src/index.css; these two preloads start the
         download in parallel with the bundle instead of after it. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/anton-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />

    <!-- Analytics, Meta Pixel and Clarity — gtag.js and fbevents.js alone are
         267 KB, and parsing that competes with React for the main thread during
         the exact window that decides whether the page feels fast. All three
         stubs below queue calls immediately, so nothing is lost; only the
         network fetch waits for the browser to go idle (or for the first touch,
         if the reader beats it). PageView therefore still fires for bouncers. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LVFV0JTWBE', { 'anonymize_ip': true });

      !function(f,n){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[]}(window);
      fbq('init', '1566242625059670');
      fbq('track', 'PageView');

      window.clarity = window.clarity || function () {
        (window.clarity.q = window.clarity.q || []).push(arguments);
      };

      (function () {
        var done = false;
        function load() {
          if (done) return;
          done = true;
          ['https://www.googletagmanager.com/gtag/js?id=G-LVFV0JTWBE',
           'https://connect.facebook.net/en_US/fbevents.js',
           'https://www.clarity.ms/tag/xxn8s6f69i'].forEach(function (src) {
            var s = document.createElement('script');
            s.async = true;
            s.src = src;
            document.head.appendChild(s);
          });
        }
        ['pointerdown', 'keydown', 'scroll'].forEach(function (t) {
          addEventListener(t, load, { once: true, passive: true });
        });
        if (window.requestIdleCallback) requestIdleCallback(load, { timeout: 3500 });
        else setTimeout(load, 2500);
      })();
    </script>
