# ─── PRODUCTION DEPLOY (Cloudflare in front of Hostinger) ────────────────────
# Before `npm run deploy:worker`, change the 3 marked spots below:
#   1. routes.pattern  → your Cloudflare-proxied hostname (a zone in YOUR account)
#   2. the two kv_namespaces ids → IDs from `npx wrangler kv namespace create ...`
#   3. set the secret:  `npx wrangler secret put EDGE_SECRET`
# Default mode = Cloudflare serves the built SPA from [assets] (Hostinger not
# needed). To instead let HOSTINGER serve the files: comment out [assets] below
# and add  →  [vars]\n  ORIGIN_URL = "https://origin.<your-domain>"  (a SEPARATE
# DNS-only/grey-cloud record pointing at Hostinger, so the Worker doesn't loop).
# ─────────────────────────────────────────────────────────────────────────────
name = "forexpassing-edge"
main = "edge.ts"
compatibility_date = "2026-01-01"

workers_dev = false

[[routes]]
pattern = "forexpassing.com"  # ← (1) must be a zone in YOUR Cloudflare account
custom_domain = true

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Only HTML pages, API endpoints, and honeypot trigger the Worker.
# Static assets (JS/CSS/img/fonts) are served directly from CF edge cache → fast.
# /watch + /thank-you are money-side standalone pages → gated in edge.ts.
run_worker_first = [
  "/",
  "/meta-funnel",
  "/insta-funnel",
  "/google-funnel",
  "/tiktok-funnel",
  "/watch",
  "/watch.html",
  "/thank-you",
  "/thank-you.html",
  "/api/*",
  "/v1/migration/portal",
]

# Namespace IDs celowo NIE sa trzymane w publicznym repo. bin/deploy.sh tworzy
# namespace'y (idempotentnie) i podmienia oba placeholdery na realne ID przy deployu.
# Recznie: npx wrangler kv namespace create USED_CLICKS -> wklej id ponizej (lokalnie).
[[kv_namespaces]]
binding = "USED_CLICKS"
id = "local-used-clicks"

[[kv_namespaces]]
binding = "EDGE_LOG"
id = "local-edge-log"

# Durable per-hit stats - every classification is inserted as one row (never rolls off).
# OPCJONALNE: kod dziala bez tego bindingu (log.ts robi `if (!env.STATS) return`).
# Odkomentuj lokalnie i wpisz swoje database_id z `npx wrangler d1 create <nazwa>`.
# [[d1_databases]]
# binding = "STATS"
# database_name = "forexpassing-stats"
# database_id = "<twoje-d1-database-id>"

[dev]
port = 8787
local_protocol = "http"
