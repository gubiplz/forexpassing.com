# ─── PRODUCTION DEPLOY (Cloudflare in front of Vercel) ───────────────────────
# Before `npm run deploy:worker`, change the 3 marked spots below:
#   1. routes.pattern  → your Cloudflare-proxied hostname (a zone in YOUR account)
#   2. the two kv_namespaces ids → IDs from `npx wrangler kv namespace create ...`
#   3. set the secret:  `npx wrangler secret put EDGE_SECRET`
#
# ORIGIN mode (active): Vercel serves the built SPA, the Worker classifies each
# visitor and injects window.__INITIAL_STATE__ into the HTML on the way back.
# The injection is what makes cloaking work at all — without it the SPA falls
# back to src/runtime/no-edge.ts and picks the page by path, so every visitor
# hitting an ad slug sees the offer, ad reviewers included.
#
# ORIGIN_URL must be the origin's OWN hostname (*.vercel.app), never the public
# domain: the Worker would loop, and Vercel denies the public Host outright.
# To go back to Cloudflare serving the files, drop [vars] and restore [assets]
# (directory "../dist", binding "ASSETS", plus a run_worker_first list).
# ─────────────────────────────────────────────────────────────────────────────
name = "forexpassing-edge"
main = "edge.ts"
compatibility_date = "2026-01-01"

workers_dev = false

# Pattern routes, not custom_domain: the zone's DNS already points at the origin
# through the Cloudflare proxy, and a custom domain would rewrite those records.
# A route only intercepts in front of them.
[[routes]]
pattern = "forexpassing.com/*"  # ← (1) must be a zone in YOUR Cloudflare account
zone_name = "forexpassing.com"

[[routes]]
pattern = "www.forexpassing.com/*"
zone_name = "forexpassing.com"

[vars]
ORIGIN_URL = "https://forexpassing-com.vercel.app"

# Namespace IDs celowo NIE sa trzymane w publicznym repo. bin/deploy.sh tworzy
# namespace'y (idempotentnie) i podmienia oba placeholdery na realne ID przy deployu.
# Recznie: npx wrangler kv namespace create USED_CLICKS -> wklej id ponizej (lokalnie).
[[kv_namespaces]]
binding = "USED_CLICKS"
id = "local-used-clicks"

[[kv_namespaces]]
binding = "EDGE_LOG"
id = "local-edge-log"

# Durable per-hit stats - every classification is inserted as one row (never rolls off).
# The KV log is a 100-entry ring on one key, so it covers about two hours and drops
# writes that land in the same second; this is the log you query for a full day.
# database_id jest placeholderem z tego samego powodu co KV — bin/deploy.sh podmienia.
[[d1_databases]]
binding = "STATS"
database_name = "forexpassing-stats"
database_id = "local-stats-db"

[dev]
port = 8787
local_protocol = "http"
