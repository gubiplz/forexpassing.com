# Weekly roll for the track record — SUPERSEDED, KEPT FOR THE RECORD. DO NOT INSTALL.
#
# The job this file was written for is done from outside the repo: a weekly Make
# scenario POSTs to a Vercel Deploy Hook, the build that follows runs
# bin/roll-track-record.mjs as its first step, and the resulting
# deployment_status fires .github/workflows/track-record-refresh.yml, so the
# Telegram posters move in the same pass. Nothing here to switch on.
#
# There is deliberately no endpoint of ours in that chain. A Deploy Hook is a
# plain URL that only ever asks for a build of one branch, so the scenario can
# hold it directly — wrapping it in an API route would have bought nothing and
# cost two more environment variables to keep alive.
#
# Installing it would in fact do nothing at all: `schedule:` does not fire in
# this repo. Two variants were tried, zero runs, while workflow_dispatch worked
# the whole time — see the header of .github/workflows/telegram-spots.yml.
#
# Worth knowing if you ever revive the idea: this variant COMMITS the rolled
# JSON, the build-time roll does not. That difference does not matter, because
# the generator is deterministic — the build reproduces the committed baseline
# byte for byte and only tops it up to today. The commit would buy nothing.

name: Roll track record

# Adds the missing weeks to the track record and commits them, so the panel on
# the site keeps moving instead of freezing on the day it was built.
#
# The generator is deterministic per week: a re-run never rewrites a week that
# already exists, so this can fire twice without disturbing history.

on:
  schedule:
    # Mondays, 06:15 UTC — after the week it is recording has closed.
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  roll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Append the missing weeks
        working-directory: STRONA
        run: node bin/roll-track-record.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- STRONA/src/data/track-record-days.json; then
            echo "No new week to add."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STRONA/src/data/track-record-days.json
          git commit -m "Track record: dopisany tydzien $(date -u +%Y-%m-%d)"
          git push
